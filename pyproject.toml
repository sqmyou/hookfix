[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hookfix"
version = "0.2.0"
description = "Find the hidden imports that break your frozen Python app."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sqm", email = "sqmyou@users.noreply.github.com" }]
keywords = [
    "pyinstaller",
    "nuitka",
    "freeze",
    "packaging",
    "hidden-imports",
    "bundling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
hookfix = "hookfix.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.6",
    # The integration test freezes a real app and runs the binary. Without
    # PyInstaller installed it is skipped, which is how a dead hook file shipped
    # unnoticed. Keep it here so CI exercises the freeze.
    "pyinstaller>=6",
]

[project.urls]
Homepage = "https://github.com/sqmyou/hookfix"
Repository = "https://github.com/sqmyou/hookfix"
Changelog = "https://github.com/sqmyou/hookfix/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.6",
    "pyinstaller>=6",
]

[tool.hatch.version]
path = "src/hookfix/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hookfix"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/hookfix"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["hookfix"]

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
